services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ai_os
      POSTGRES_USER: ai_os
      POSTGRES_PASSWORD: ai_os_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
